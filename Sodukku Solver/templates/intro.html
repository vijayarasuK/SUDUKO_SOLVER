<!DOCTYPE html>
<html>
<head>
    <title>Sudoku Solver</title>

    <!-- Auto redirect -->
    <meta http-equiv="refresh" content="4;url=/home">

    
<style>
   body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Segoe UI', sans-serif;

    /* LIGHT GRADIENT */
    background: linear-gradient(135deg, #f9fcff, #e0f7ff, #f0fdf4);

    position: relative;
}

    /* floating glow circles */
    body::before,
    body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
        animation: floatGlow 8s ease-in-out infinite alternate;
    }

    body::before {
        width: 280px;
        height: 280px;
        background: rgba(0, 229, 255, 0.35);
        top: 40px;
        left: 60px;
    }

    body::after {
        width: 250px;
        height: 250px;
        background: rgba(0, 255, 170, 0.30);
        bottom: 50px;
        right: 60px;
        animation-duration: 10s;
    }
    body::before {
    background: rgba(0, 200, 255, 0.18);
}

body::after {
    background: rgba(0, 255, 170, 0.15);
}

    /* extra center light */
    .bg-light {
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(255,255,255,0.8), transparent 70%);
        border-radius: 50%;
        filter: blur(70px);
        z-index: 0;
        animation: pulseLight 4s ease-in-out infinite;
    }

    /* logo */
    .logo {
        position: relative;
        z-index: 2;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #00bcd4;
        text-shadow:
            0 0 10px rgba(0,188,212,0.5),
            0 0 20px rgba(0,188,212,0.35),
            0 0 35px rgba(0,188,212,0.25);
        animation: logoPop 1.8s ease, logoGlow 2s ease-in-out infinite alternate;
    }

    /* subtitle */
    .subtitle {
        position: relative;
        z-index: 2;
        margin-top: 18px;
        font-size: 22px;
        font-weight: 500;
        color: #3b4b5a;
        letter-spacing: 1px;
        animation: fadeUp 2.2s ease;
    }

    /* dots loading */
    .loading-dots {
        position: relative;
        z-index: 2;
        margin-top: 20px;
        font-size: 18px;
        color: #0097a7;
        letter-spacing: 3px;
    }

    .loading-dots span {
        display: inline-block;
        animation: blink 1.4s infinite;
    }

    .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    /* ring loader */
    .loader {
        position: relative;
        z-index: 2;
        margin-top: 28px;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 5px solid rgba(0,188,212,0.15);
        border-top: 5px solid #00bcd4;
        border-right: 5px solid #00e5ff;
        box-shadow:
            0 0 12px rgba(0,188,212,0.25),
            0 0 25px rgba(0,229,255,0.15);
        animation: spin 1s linear infinite;
    }

    /* soft lines */
    .line {
        position: absolute;
        width: 220px;
        height: 220px;
        border: 2px solid rgba(0,188,212,0.12);
        border-radius: 50%;
        z-index: 1;
        animation: rotateRing 12s linear infinite;
    }

    .line2 {
        width: 320px;
        height: 320px;
        animation-duration: 18s;
    }

    /* animations */
    @keyframes logoPop {
        0% {
            transform: scale(0.4) translateY(40px);
            opacity: 0;
        }
        100% {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
    }

    @keyframes logoGlow {
        from {
            text-shadow:
                0 0 10px rgba(0,188,212,0.45),
                0 0 20px rgba(0,188,212,0.25);
        }
        to {
            text-shadow:
                0 0 18px rgba(0,229,255,0.65),
                0 0 30px rgba(0,229,255,0.35),
                0 0 45px rgba(0,229,255,0.22);
        }
    }

    @keyframes fadeUp {
        0% {
            opacity: 0;
            transform: translateY(20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes spin {
        100% {
            transform: rotate(360deg);
        }
    }

    @keyframes blink {
        0%, 80%, 100% {
            opacity: 0.3;
            transform: translateY(0);
        }
        40% {
            opacity: 1;
            transform: translateY(-4px);
        }
    }

    @keyframes floatGlow {
        0% {
            transform: translate(0, 0) scale(1);
        }
        100% {
            transform: translate(25px, -20px) scale(1.08);
        }
    }

    @keyframes pulseLight {
        0% {
            transform: scale(0.95);
            opacity: 0.7;
        }
        100% {
            transform: scale(1.08);
            opacity: 1;
        }
    }

    @keyframes rotateRing {
        100% {
            transform: rotate(360deg);
        }
    }
    /* dotted moving background */
.dots-bg {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background-image: radial-gradient(rgba(0, 188, 212, 0.22) 1.5px, transparent 1.5px);
    background-size: 30px 30px;
    animation: moveDots 18s linear infinite;
    z-index: 0;
    opacity: 0.7;
}
/* sliding light line */
.slide-light {
    position: absolute;
    top: 0;
    left: -30%;
    width: 30%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.35),
        transparent
    );
    transform: skewX(-20deg);
    animation: slideLight 4s linear infinite;
    z-index: 1;
}
@keyframes moveDots {
    0% {
        transform: translate(0, 0);
    }
    100% {
        transform: translate(120px, 120px);
    }
}

@keyframes slideLight {
    0% {
        left: -35%;
    }
    100% {
        left: 120%;
    }
}
</style>
</head>

<body>

    <audio autoplay>
        <source src="{{ url_for('static', filename='intro.mp3') }}" type="audio/mpeg">
    </audio>

    <div class="bg-light"></div>
    <div class="line"></div>
    <div class="line line2"></div>
    <div class="dots-bg"></div>
    <div class="slide-light"></div>
    <div class="logo">🧩 SUDOKU</div>
    <div class="subtitle">Loading Solver</div>

    <div class="loading-dots">
        <span>.</span><span>.</span><span>.</span>
    </div>

    <div class="loader"></div>

</body>
</html>
